[project]
name = "fairpoker"
version = "0.1.0"
description = "Finding fair poker tables with network analysis"
requires-python = ">=3.11"
dependencies = ["pokerkit>=0.6", "networkx>=3.2", "numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
